<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttendSense - Accelerometer Presentation</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Inter", sans-serif;
      background: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Mencegah scroll ganda di halaman utama */
    }
    
    header {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      padding: 20px 24px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 10;
      position: relative;
    }

    .back-button {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }
    .back-button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-50%) scale(1.1);
    }

    header h1 {
      font-size: 1.5rem;
    }
    header p {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    .iframe-wrapper {
      display: flex;
      flex: 1;
      width: 100%;
      height: 100%;
    }
    
    iframe {
      border: none;
      height: 100%;
      width: 100%;
    }
    
    /* Mengatur proporsi lebar iframe */
    #frame-client {
      flex: 1; /* Mengambil 1/2 ruang untuk Client */
      border-right: 2px solid #e2e8f0;
      background: #f8fafc;
    }
    
    #frame-admin {
      flex: 1.5; /* Mengambil 1.5 ruang agar grafik admin lebih lebar dan jelas */
      background: #ccfbf1; 
    }

    /* Responsif untuk layar kecil (ditumpuk atas bawah) */
    @media (max-width: 1024px) {
      .iframe-wrapper {
        flex-direction: column;
      }
      #frame-client {
        border-right: none;
        border-bottom: 2px solid #e2e8f0;
        flex: 1;
      }
      #frame-admin {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html" class="back-button"><i class="fas fa-arrow-left"></i></a>
    <h1><i class="fas fa-mobile-alt"></i> Presentasi Modul 2: Accelerometer</h1>
    <p>Simulasi Interaktif: Client (Kiri) dan Admin Dashboard (Kanan)</p>
  </header>

  <div class="iframe-wrapper">
    <iframe id="frame-client" src="client.html" title="Tampilan Client"></iframe>
    
    <iframe id="frame-admin" src="admin.html" title="Tampilan Admin"></iframe>
  </div>

</body>
</html>
