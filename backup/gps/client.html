<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttendSense - GPS Client</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <style>
    :root { --primary: #059669; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; }
    body { font-family: "Inter", sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .card { background: var(--card-bg); padding: 24px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
    .status-ui { margin: 20px 0; padding: 20px; background: #f1f5f9; border-radius: 15px; }
    .val { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: var(--primary); }
    button { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; color: white; margin-top: 10px; }
    .btn-start { background: var(--primary); }
    .btn-stop { background: #ef4444; display: none; }
    .log { height: 100px; overflow-y: auto; background: #1e293b; color: #10b981; padding: 10px; border-radius: 8px; font-size: 0.8rem; text-align: left; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color: var(--primary)"><i class="fas fa-broadcast-tower"></i> GPS Broadcaster</h2>
    <p id="devIdDisplay" style="font-size: 0.8rem; color: #64748b; margin-top: 5px;"></p>
    
    <div class="status-ui">
      <div style="margin-bottom: 10px;">Akurasi: <span id="acc" class="val">Menunggu...</span></div>
      <div style="display: flex; justify-content: space-around;">
        <div>Lat: <div id="lat" class="val">-</div></div>
        <div>Lng: <div id="lng" class="val">-</div></div>
      </div>
    </div>

    <button id="btnStart" class="btn-start" onclick="start()"><i class="fas fa-play"></i> Mulai Transmisi</button>
    <button id="btnStop" class="btn-stop" onclick="stop()"><i class="fas fa-stop"></i> Hentikan</button>
    
    <div id="log" class="log">Sistem siap...</div>
  </div>

  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbyYn2DefdPzUDlCIoJllHU3bANyrMtJhFKcQtcA0u_SGDpBepes1W0m36wMSlBITYhT/exec";
    const myId = localStorage.getItem("attendsense_device_id") || "DEV-" + Math.random().toString(36).substring(2, 8).toUpperCase();
    localStorage.setItem("attendsense_device_id", myId);
    document.getElementById("devIdDisplay").innerText = "ID: " + myId;

    let watchId = null;

    function log(msg) {
      const l = document.getElementById("log");
      l.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + l.innerHTML;
    }

    function start() {
      document.getElementById("btnStart").style.display = "none";
      document.getElementById("btnStop").style.display = "block";
      log("Mencari sinyal GPS...");

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const { latitude: lt, longitude: lg, accuracy: ac } = pos.coords;
          document.getElementById("lat").innerText = lt.toFixed(5);
          document.getElementById("lng").innerText = lg.toFixed(5);
          document.getElementById("acc").innerText = "±" + Math.round(ac) + "m";
          
          send(lt, lg, ac);
        },
        err => log("Error: " + err.message),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }

    async function send(lat, lng, acc) {
      try {
        const res = await fetch(`${BASE_URL}?path=telemetry/gps`, {
          method: "POST",
          body: JSON.stringify({ device_id: myId, ts: new Date().toISOString(), lat, lng, accuracy_m: acc })
        });
        if (res.ok) log("Data terkirim.");
      } catch (e) { log("Gagal kirim ke Cloud."); }
    }

    function stop() {
      navigator.geolocation.clearWatch(watchId);
      document.getElementById("btnStart").style.display = "block";
      document.getElementById("btnStop").style.display = "none";
      log("Transmisi dihentikan.");
    }
  </script>
</body>
</html>
